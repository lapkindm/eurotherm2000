[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurotherm"
version = "0.1.0"
description = "Python driver for Eurotherm Series 2000 temperature controllers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

authors = [
    {name = "Dmitry Lapkin"}
]

dependencies = [
    "minimalmodbus>=2.1",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
include = ["eurotherm*"]